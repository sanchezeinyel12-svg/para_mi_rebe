<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi amorcito</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --rose:       #c9426a;
            --rose-light: #e8758a;
            --rose-pale:  #fce8ee;
            --rose-deep:  #8b1a3a;
            --rose-petal: #d4607e;
            --cream:      #fdf6f0;
            --gold:       #c4956a;
            --green-stem: #4a7c44;
            --green-leaf: #5d9e56;
            --text-dark:  #3a1a2a;
            --text-mid:   #7a4a5a;
            --white:      #ffffff;
            --shadow:     rgba(140,40,80,0.18);
            --font-serif: 'Playfair Display', Georgia, serif;
            --font-sans:  'Lato', sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }

        body {
            min-height: 100vh;
            background-color: var(--cream);
            background-image:
                radial-gradient(ellipse 80% 60% at 20% 10%, #f7d6e0 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 80% 90%, #fce0ee 0%, transparent 55%);
            font-family: var(--font-sans);
            color: var(--text-dark);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ── Partículas ── */
        #bgParticles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }

        /* ── Wrapper ── */
        .wrapper {
            position: relative;
            z-index: 10;
            width: min(700px, 100%);
            padding: 48px 24px 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        /* ── Header ── */
        .hint {
            font-family: var(--font-sans);
            font-weight: 300;
            font-size: 0.72rem;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--rose-light);
            text-align: center;
        }

        .main-title {
            font-family: var(--font-serif);
            font-size: clamp(2rem, 8vw, 3.2rem);
            font-weight: 700;
            background: linear-gradient(135deg, var(--rose-deep), var(--rose), var(--rose-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            line-height: 1.1;
        }

        .sub {
            font-family: var(--font-serif);
            font-style: italic;
            font-size: clamp(0.85rem, 2vw, 1rem);
            color: var(--text-mid);
            text-align: center;
            margin-top: 4px;
        }

        /* ── Rosa SVG area ── */
        .rose-area {
            position: relative;
            width: min(480px, 94vw);
            margin-top: 16px;
        }

        .rose-svg {
            width: 100%;
            height: auto;
            display: block;
            filter: drop-shadow(0 16px 40px rgba(140,40,80,0.2));
        }

        /* Pétalos clicables */
        .petal-hit {
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .petal-hit:hover { opacity: 0.82; }
        .petal-hit.revealed .petal-shape { filter: brightness(0.88); }

        /* Número del pétalo */
        .petal-num {
            font-family: var(--font-serif);
            font-size: 13px;
            fill: rgba(255,255,255,0.85);
            pointer-events: none;
            font-weight: 700;
            text-anchor: middle;
            dominant-baseline: central;
        }

        /* ── Panel de frase ── */
        .phrase-panel {
            width: 100%;
            background: var(--white);
            border-radius: 20px;
            padding: 36px 40px;
            box-shadow:
                0 4px 6px rgba(0,0,0,.04),
                0 20px 60px var(--shadow),
                inset 0 1px 0 rgba(255,255,255,.9);
            border: 1px solid rgba(201,66,106,0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s cubic-bezier(.22,1,.36,1), transform 0.5s cubic-bezier(.22,1,.36,1);
            min-height: 120px;
            text-align: center;
        }

        .phrase-panel.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .phrase-icon {
            font-size: 1.6rem;
            line-height: 1;
        }

        .phrase-num {
            font-family: var(--font-sans);
            font-weight: 300;
            font-size: 0.65rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--rose-light);
        }

        .phrase-text {
            font-family: var(--font-serif);
            font-size: clamp(1rem, 2.8vw, 1.2rem);
            line-height: 1.7;
            color: var(--text-dark);
            font-style: italic;
        }

        /* ── Contador de pétalos ── */
        .petal-counter {
            font-family: var(--font-sans);
            font-weight: 300;
            font-size: 0.72rem;
            letter-spacing: 0.18em;
            color: var(--text-mid);
            text-align: center;
        }

        .petal-counter span {
            color: var(--rose);
            font-weight: 400;
        }

        /* ── Mensaje final ── */
        .final-msg {
            width: 100%;
            background: linear-gradient(135deg, #fff0f5, #fce4ee);
            border-radius: 20px;
            padding: 36px 40px;
            border: 1px solid rgba(201,66,106,0.2);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 10px;
            opacity: 0;
            transform: scale(0.96);
            transition: opacity 0.6s cubic-bezier(.22,1,.36,1), transform 0.6s cubic-bezier(.22,1,.36,1);
            pointer-events: none;
        }

        .final-msg.visible {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        .final-msg p {
            font-family: var(--font-serif);
            font-size: clamp(1.05rem, 3vw, 1.25rem);
            color: var(--rose-deep);
            line-height: 1.7;
        }

        .final-msg .sig {
            font-family: var(--font-sans);
            font-weight: 300;
            font-size: 0.85rem;
            color: var(--rose-light);
            letter-spacing: 0.08em;
            margin-top: 4px;
        }

        @media (max-width: 500px) {
            .phrase-panel { padding: 28px 22px; }
            .final-msg    { padding: 28px 22px; }
        }
    </style>
</head>
<body>

<div id="bgParticles"></div>

<div class="wrapper">

    <p class="hint">toca cada pétalo</p>
    <h1 class="main-title">Una rosa para ti mi niña linda</h1>
    <p class="sub">Ocho pétalos, ocho cosas que siento por ti mi rebe</p>

    <!-- Rosa SVG -->
    <div class="rose-area">
        <svg class="rose-svg" viewBox="0 0 480 520" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Gradientes pétalos -->
                <radialGradient id="pg0" cx="50%" cy="60%" r="55%">
                    <stop offset="0%" stop-color="#f0a0bc"/>
                    <stop offset="100%" stop-color="#b03060"/>
                </radialGradient>
                <radialGradient id="pg1" cx="40%" cy="55%" r="55%">
                    <stop offset="0%" stop-color="#f2a8c2"/>
                    <stop offset="100%" stop-color="#a82858"/>
                </radialGradient>
                <radialGradient id="pg2" cx="60%" cy="55%" r="55%">
                    <stop offset="0%" stop-color="#eda8bf"/>
                    <stop offset="100%" stop-color="#b03565"/>
                </radialGradient>
                <radialGradient id="pg3" cx="45%" cy="60%" r="55%">
                    <stop offset="0%" stop-color="#f5b0c8"/>
                    <stop offset="100%" stop-color="#ac2e5c"/>
                </radialGradient>
                <radialGradient id="pg4" cx="55%" cy="50%" r="55%">
                    <stop offset="0%" stop-color="#f8b8cc"/>
                    <stop offset="100%" stop-color="#b83568"/>
                </radialGradient>
                <radialGradient id="pg5" cx="45%" cy="55%" r="55%">
                    <stop offset="0%" stop-color="#eea2bc"/>
                    <stop offset="100%" stop-color="#a42856"/>
                </radialGradient>
                <radialGradient id="pg6" cx="50%" cy="45%" r="55%">
                    <stop offset="0%" stop-color="#f0aabe"/>
                    <stop offset="100%" stop-color="#aa3060"/>
                </radialGradient>
                <radialGradient id="pg7" cx="50%" cy="60%" r="55%">
                    <stop offset="0%" stop-color="#f3b0c4"/>
                    <stop offset="100%" stop-color="#b23265"/>
                </radialGradient>
                <!-- Gradiente centro -->
                <radialGradient id="cg" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#f7c8d8"/>
                    <stop offset="100%" stop-color="#c9426a"/>
                </radialGradient>
                <!-- Gradiente tallo -->
                <linearGradient id="stemG" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#3d6b38"/>
                    <stop offset="100%" stop-color="#5d9e56"/>
                </linearGradient>
                <!-- Sombra pétalos -->
                <filter id="petalShadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#8b1a3a" flood-opacity="0.25"/>
                </filter>
                <filter id="centerShadow">
                    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6b1030" flood-opacity="0.3"/>
                </filter>
            </defs>

            <!-- ══ TALLO ══ -->
            <path d="M240 370 C238 410, 234 440, 232 490" stroke="url(#stemG)" stroke-width="5" fill="none" stroke-linecap="round"/>
            <!-- Hoja izquierda -->
            <path d="M236 420 C210 405, 196 390, 200 375 C212 380, 226 395, 236 420Z" fill="#4a7c44" opacity="0.9"/>
            <path d="M236 420 C218 408, 206 392, 200 375" stroke="#3d6b38" stroke-width="1" fill="none"/>
            <!-- Hoja derecha -->
            <path d="M234 445 C262 432, 276 418, 270 402 C258 408, 244 425, 234 445Z" fill="#5d9e56" opacity="0.85"/>
            <path d="M234 445 C254 434, 268 420, 270 402" stroke="#4a7c44" stroke-width="1" fill="none"/>

            <!-- ══ SÉPALOS ══ -->
            <path d="M240 370 C226 355, 214 348, 216 338 C224 342, 234 354, 240 370Z" fill="#4a7c44" opacity="0.8"/>
            <path d="M240 370 C254 355, 266 348, 264 338 C256 342, 246 354, 240 370Z" fill="#5d9e56" opacity="0.75"/>
            <path d="M240 370 C240 350, 240 340, 240 335 C242 342, 242 355, 240 370Z" fill="#4a7c44" opacity="0.7"/>

            <!-- ══ PÉTALOS CAPA EXTERIOR (4) ══ -->
            <!-- Pétalo 1 — arriba -->
            <g class="petal-hit" id="petal-0" onclick="revealPetal(0)">
                <ellipse cx="240" cy="200" rx="48" ry="72" fill="url(#pg0)" filter="url(#petalShadow)"
                    transform="rotate(-5 240 295)" opacity="0.92"/>
                <text class="petal-num" x="240" y="188">1</text>
            </g>
            <!-- Pétalo 2 — derecha alta -->
            <g class="petal-hit" id="petal-1" onclick="revealPetal(1)">
                <ellipse cx="305" cy="228" rx="46" ry="68" fill="url(#pg1)" filter="url(#petalShadow)"
                    transform="rotate(52 240 295)" opacity="0.9"/>
                <text class="petal-num" x="320" y="215">2</text>
            </g>
            <!-- Pétalo 3 — derecha baja -->
            <g class="petal-hit" id="petal-2" onclick="revealPetal(2)">
                <ellipse cx="305" cy="362" rx="46" ry="68" fill="url(#pg2)" filter="url(#petalShadow)"
                    transform="rotate(128 240 295)" opacity="0.9"/>
                <text class="petal-num" x="316" y="370">3</text>
            </g>
            <!-- Pétalo 4 — abajo -->
            <g class="petal-hit" id="petal-3" onclick="revealPetal(3)">
                <ellipse cx="240" cy="390" rx="48" ry="72" fill="url(#pg3)" filter="url(#petalShadow)"
                    transform="rotate(185 240 295)" opacity="0.92"/>
                <text class="petal-num" x="240" y="402">4</text>
            </g>

            <!-- ══ PÉTALOS CAPA INTERIOR (4) ══ -->
            <!-- Pétalo 5 — arriba izq -->
            <g class="petal-hit" id="petal-4" onclick="revealPetal(4)">
                <ellipse cx="195" cy="228" rx="42" ry="62" fill="url(#pg4)" filter="url(#petalShadow)"
                    transform="rotate(-52 240 295)" opacity="0.93"/>
                <text class="petal-num" x="183" y="216">5</text>
            </g>
            <!-- Pétalo 6 — arriba der -->
            <g class="petal-hit" id="petal-5" onclick="revealPetal(5)">
                <ellipse cx="284" cy="238" rx="40" ry="60" fill="url(#pg5)" filter="url(#petalShadow)"
                    transform="rotate(28 240 295)" opacity="0.93"/>
                <text class="petal-num" x="295" y="234">6</text>
            </g>
            <!-- Pétalo 7 — abajo der -->
            <g class="petal-hit" id="petal-6" onclick="revealPetal(6)">
                <ellipse cx="284" cy="352" rx="40" ry="60" fill="url(#pg6)" filter="url(#petalShadow)"
                    transform="rotate(152 240 295)" opacity="0.93"/>
                <text class="petal-num" x="292" y="358">7</text>
            </g>
            <!-- Pétalo 8 — abajo izq -->
            <g class="petal-hit" id="petal-7" onclick="revealPetal(7)">
                <ellipse cx="196" cy="362" rx="42" ry="62" fill="url(#pg7)" filter="url(#petalShadow)"
                    transform="rotate(-128 240 295)" opacity="0.93"/>
                <text class="petal-num" x="184" y="368">8</text>
            </g>

            <!-- ══ CENTRO ══ -->
            <circle cx="240" cy="295" r="46" fill="url(#cg)" filter="url(#centerShadow)"/>
            <circle cx="240" cy="295" r="34" fill="#d4607e" opacity="0.6"/>
            <circle cx="240" cy="295" r="22" fill="#c9426a" opacity="0.8"/>
            <!-- Corazón central pequeño -->
            <text style="font-size:22px; text-anchor:middle; dominant-baseline:central;" x="240" y="297">❤️</text>
        </svg>
    </div>

    <!-- Contador de pétalos -->
    <p class="petal-counter" id="petalCounter">
        <span id="revealedCount">0</span> de 8 pétalos descubiertos
    </p>

    <!-- Panel frase -->
    <div class="phrase-panel" id="phrasePanel">
        <div class="phrase-icon" id="phraseIcon">🌹</div>
        <p class="phrase-num" id="phraseNum">pétalo 1</p>
        <p class="phrase-text" id="phraseText"></p>
    </div>

    <!-- Mensaje final (aparece cuando abren los 8) -->
    <div class="final-msg" id="finalMsg">
        <p>Esta rosa que me costo hacerla amor jeje nunca se marchitara como el amor que te tengo..</p>
        <p class="sig">— Tu angelito ❤️</p>
    </div>

</div>

<script>
const FRASES = [
    { icon: "😅", text: "Desde el primer día que te vi me dejaste sin palabras y ni saludarte bien pude ." },
    { icon: "😂", text: "Me encanta cuando nos molestamos uno al otro y cuando te enojas pero luego me sonries uff." },
    { icon: "💪", text: "Yo voy al gimnasio pero tu me demuestras lo fuertes que eres mi amor nunca te rindes ante nada." },
    { icon: "🌙", text: "Pienso en ti antes de dormir y lo primero que hago es ver tus mensajes que me alegran la mañana." },
    { icon: "🎓", text: "Verte luchar por tus sueños me llena de un orgullo que no sé cómo explicarte. Vas a llegar lejos, mi psicóloga preciosa." },
    { icon: "🤝", text: "Estare siempre para ti aunque aveces me dices que puedes tu solita y yo se pero yo estare para lo que sea siempre mi amor siempre." },
    { icon: "✨", text: "Tu sonrisa me mata, por eso veme mas y mas que si voy a morir lo hare feliz." },
    { icon: "♾️", text: "Te quiero hoy, te voy a querer mañana, y dentro de muchos años todavía voy a elegirte a ti siempre a ti mi psicologa bonita inteligente preciosa siempre para ti este loquito solo tiene ojos para ti solo para ti." },
];

let revealed = new Set();

function revealPetal(index) {
    const panel   = document.getElementById("phrasePanel");
    const icon    = document.getElementById("phraseIcon");
    const num     = document.getElementById("phraseNum");
    const text    = document.getElementById("phraseText");
    const counter = document.getElementById("revealedCount");
    const finalEl = document.getElementById("finalMsg");
    const petalEl = document.getElementById("petal-" + index);

    revealed.add(index);
    petalEl.classList.add("revealed");

    const frase = FRASES[index];
    icon.textContent  = frase.icon;
    num.textContent   = "pétalo " + (index + 1);
    text.textContent  = frase.text;
    counter.textContent = revealed.size;

    panel.classList.remove("visible");
    void panel.offsetWidth;
    panel.classList.add("visible");
    panel.scrollIntoView({ behavior: "smooth", block: "nearest" });

    if (revealed.size === FRASES.length) {
        setTimeout(() => {
            finalEl.classList.add("visible");
            finalEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }, 600);
    }
}

// ── Partículas ──
(function() {
    const container = document.getElementById("bgParticles");
    const emojis = ["❤️","🌸","✨","💕","🩷"];
    const style = document.createElement("style");
    style.textContent = `@keyframes pf {
        0%   { transform: translateY(0) scale(.5) rotate(0deg); opacity: 0; }
        15%  { opacity: .6; }
        80%  { opacity: .25; }
        100% { transform: translateY(-110vh) scale(1) rotate(360deg); opacity: 0; }
    }`;
    document.head.appendChild(style);
    function spawn() {
        const el = document.createElement("div");
        el.style.cssText = `position:absolute;font-size:${10+Math.random()*12}px;left:${Math.random()*100}%;bottom:-60px;opacity:0;animation:pf ${7+Math.random()*7}s linear forwards;pointer-events:none;user-select:none;`;
        el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
        container.appendChild(el);
        setTimeout(() => el.remove(), 14000);
    }
    setInterval(spawn, 2400);
})();
</script>
</body>
</html>
